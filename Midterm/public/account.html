<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8"/>
		<title>My Account</title>
        <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- scales to fit screen size-->
		<link rel="stylesheet" href="/styles/index.css"/>
        <link rel="stylesheet" href="/styles/navigationBar.css"/>
        <link rel="stylesheet" href="/styles/account.css"/>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="/scripts/navigationBar.js"></script>
        <script src="/scripts/account.js"></script>
        
	</head>
    <body>
        <img class = "pageBackground" src="/images/old-wrinkled-paper.jpg">
        <div id="TitleHeader" class="header">
            <div class="titleFlex logoWrapper">
                <a href="/home"><img class="logo" id="gameLogo" src="/images/gameLogo.png"></img></a>
            </div>
            <div class="titleFlex">
                <h1>My Account</h1>
            </div>
            <div class="titleFlex" id="navigationMenu">
                <ul>
                    <li id="homeMenu">Home</li>
                    <li id="playMenu">Play</li>
                    <li id="howToPlayMenu">How to Play</li>
                </ul>
            </div>
        </div>
        <div class="profilePage">
            <img src="/images/PFP_placeholder.png" class="profilePicture" id="profilePicture">
            <div class="infoArea">
                <label for="emailDisplay">Email:</label>
                <p class="accountInfo"id="emailDisplay">Retrieving email...</p>
            </div>
            <div class="infoArea">
                <label for="usernameDisplay">Username:</label>
                <p class="accountInfo"id="usernameDisplay">Retrieving username...</p>
            </div>
            <button class="accountButton" id="editBTN">Edit</button>
            <button class="accountButton" id="logoutBTN">Logout</button>
        </div>

    </body>
</html>
