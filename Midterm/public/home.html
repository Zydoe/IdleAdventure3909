<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8"/>
		<title>Idle adventure</title>
        <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- scales to fit screen size-->
		<link rel="stylesheet" href="/styles/index.css"/>
        <link rel="stylesheet" href="/styles/formStyles.css"/>
        <link rel="stylesheet" href="/styles/navigationBar.css"/>
        <link rel="stylesheet" href="/styles/home.css"/>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="/scripts/navigationBar.js"></script>
        <script src="/scripts/home.js"></script>
        
	</head>
    <body>
        <img class = "pageBackground" src="/images/old-wrinkled-paper.jpg">
        <div id="TitleHeader" class="header">
            <div class="titleFlex logoWrapper">
                <a href="/home"><img class="logo" id="gameLogo" src="./images/gameLogo.png"></img></a>
            </div>
            <div class="titleFlex">
                <h1>Idle Adventure</h1>
            </div>
            <div class="titleFlex" id="navigationMenu">
                <ul>
                    <li id="accountMenu">Account</li>
                    <li id="downloadsMenu">Downloads</li>
                    <li id="howToPlayMenu">How to Play</li>
                </ul>
            </div>
        </div>
        <div class="buttonWrapper">
            <button class="importantButton" id="PlayNowBTN">
                Play Now
            </button>
            <button class="importantButton" id="MyAccountBTN">
                My Account
            </button>
            <button class="importantButton" id="DownloadsBTN">
                Downloads
            </button>
            <button class="importantButton" id="UploadGameBTN">
                Upload Game
            </button>
            <button class="importantButton" id="HowToPlayBTN">
                How To Play
            </button>
        </div>  

    </body>
</html>
